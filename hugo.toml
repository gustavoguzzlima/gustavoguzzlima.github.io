baseURL = 'https://gustavolima.dev.br/'
title = 'Gustavo D. J. Lima'
theme = 'PaperMod'
defaultContentLanguage = 'en'
enableEmoji = true
enableRobotsTXT = true

[languages.en]
  locale = 'en-us'
  weight = 1

[languages.pt-br]
  locale = 'pt-br'
  title = 'Gustavo D. J. Lima'
  weight = 2

  [languages.pt-br.params]
    description = 'Faço sistemas conversarem entre si — dev, infra e ocasionalmente um acionamento, eu acho...'

    [languages.pt-br.params.profileMode]
      subtitle = 'Faço sistemas conversarem entre si — dev, infra e ocasionalmente um acionamento, eu acho...'

[params]
  description = 'I guess I make systems talk to each other — dev, infra, and the occasional critical call...'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowWordCount = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowToc = true
  ShowShareButtons = false
  enableKaTeX = true

  [params.profileMode]
    enabled = true
    title = 'Gustavo D. J. Lima'
    subtitle = 'I guess I make systems talk to each other — dev, infra, and the occasional critical call...'
    # WebP 300x300 (8 KB) servido de static/: o Hugo não reprocessa, então os
    # bytes do arquivo são os bytes entregues. O PNG de 109 KB saiu do repo.
    imageUrl = '/avatar.webp'
    imageWidth = 300
    imageHeight = 300

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/gustavoguzzlima'
[[params.socialIcons]]
  name = 'linkedin'
  url = 'https://linkedin.com/in/gustav0lima'
[[params.socialIcons]]
  name = 'x'
  url = 'https://x.com/0x477573'

# Medição. Preenchido por scripts/ativar-medicao.sh — ver docs/medicao.md.
[params.verification]
  google = ''

[params.analytics]
  cloudflareToken = ''

[menu]
  [[menu.main]]
    identifier = 'archive'
    name = 'Archive'
    url = '/archive/'
  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = '/search/'

[languages.pt-br.menu]
  [[languages.pt-br.menu.main]]
    identifier = 'archive'
    name = 'Arquivo'
    url = '/pt-br/archive/'
  [[languages.pt-br.menu.main]]
    identifier = 'search'
    name = 'Buscar'
    url = '/pt-br/search/'

[markup.highlight]
  lineNos = true
  lineNumbersInTable = true
  noClasses = false
  guessSyntax = true
