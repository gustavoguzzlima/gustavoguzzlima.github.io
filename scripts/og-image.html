<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  /* Tokens do próprio site (PaperMod theme-vars.css, tema claro) — nenhuma cor nova. */
  :root {
    --theme: rgb(255, 255, 255);
    --primary: rgb(30, 30, 30);
    --secondary: rgb(108, 108, 108);
    --border: rgb(238, 238, 238);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--theme);
    color: var(--primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 96px;
  }
  h1 {
    font-size: 76px;
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 28px;
  }
  .rule {
    width: 96px;
    height: 2px;
    background: var(--border);
    margin-bottom: 28px;
  }
  p {
    font-size: 30px;
    line-height: 1.45;
    color: var(--secondary);
    max-width: 900px;
  }
  .site {
    margin-top: 40px;
    font-size: 22px;
    color: var(--secondary);
  }
</style>
</head>
<body>
  <h1>Gustavo D. J. Lima</h1>
  <div class="rule"></div>
  <p>I guess I make systems talk to each other — dev, infra, and the occasional critical call.</p>
  <div class="site">gustavolima.dev.br</div>
</body>
</html>
